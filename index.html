<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Devils 11U AA Hockey IQ</title>

<style>
:root {
  --navy:#102f57;
  --gold:#ffca05;
  --ink:#122033;
  --muted:#637083;
  --bg:#f5f7fa;
  --white:#fff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--ink);
}

header {
  background:var(--navy);
  color:white;
  text-align:center;
  padding:30px 20px 25px;
  border-bottom:7px solid var(--gold);
}

.logo {
  width:145px;
  height:145px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:7px;
}

h1 {
  margin:12px 0 4px;
  font-size:clamp(28px,5vw,44px);
}

.sub {
  margin:0;
  color:#dce6f2;
  font-size:18px;
}

nav {
  display:flex;
  gap:9px;
  justify-content:center;
  flex-wrap:wrap;
  padding:20px 15px 5px;
}

.filter {
  border:1px solid #c9d1db;
  background:white;
  border-radius:999px;
  padding:9px 16px;
  font-weight:700;
  cursor:pointer;
}

.filter.active {
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

main {
  max-width:900px;
  margin:0 auto;
  padding:20px 18px 60px;
}

.intro {
  text-align:center;
  color:var(--muted);
  max-width:680px;
  margin:5px auto 25px;
  line-height:1.5;
}

.card {
  background:white;
  border-radius:16px;
  box-shadow:0 5px 18px rgba(16,47,87,.10);
  overflow:hidden;
  margin:0 0 24px;
}

.card-top {
  height:7px;
  background:var(--gold);
}

.content {
  padding:26px;
}

.eyebrow {
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  color:var(--navy);
  text-transform:uppercase;
}

h2 {
  font-size:28px;
  margin:8px 0 5px;
}

.meta {
  font-weight:700;
  color:var(--muted);
  margin-bottom:18px;
}

.description {
  font-size:17px;
  line-height:1.55;
}

.watch {
  background:#f4f7fb;
  border-left:5px solid var(--gold);
  padding:16px 18px;
  margin:20px 0;
}

.watch strong {
  color:var(--navy);
}

.watch ol {
  margin:10px 0 0;
  padding-left:22px;
}

.watch li {
  margin:7px 0;
  line-height:1.4;
}

.goal-id {
  font-size:14px;
  color:var(--muted);
  margin:18px 0 12px;
}

.actions {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.primary {
  display:inline-block;
  background:var(--gold);
  color:#10233e;
  text-decoration:none;
  font-weight:800;
  padding:13px 18px;
  border-radius:8px;
}

.secondary {
  display:inline-block;
  color:var(--navy);
  font-weight:700;
  text-decoration:none;
  padding:12px 5px;
}

.note {
  font-size:13px;
  color:var(--muted);
  margin-top:12px;
  line-height:1.4;
}

footer {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:0 15px 35px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="Montgomery Ice Devils logo" class="logo">
  <h1>11U AA Hockey IQ</h1>
  <p class="sub">See it. Understand it. Apply it.</p>
</header>

<nav id="filters"></nav>

<main>

<p class="intro">
Real NHL examples to help us see positioning, spacing, decision-making and team concepts.
Focus on the lesson—not just the puck.
</p>

<div id="library"></div>

</main>

<footer>
Montgomery Ice Devils 11U AA · Teaching resource
</footer>

<script>

/*
=================================================================
ICE DEVILS GOAL LIBRARY

THIS IS THE SECTION TO EDIT.

To add another lesson:

1. Copy one complete lesson from { through },
2. Paste it underneath the existing lesson.
3. Change the title, category, description, Watch For items,
   NHL links and other information.
4. Commit the change in GitHub.

You shouldn't need to touch anything else on the site.
=================================================================
*/

const lessons = [

  {
    title: "Finding Space Away From the Puck",

    category: "Offense",

    concept: "Offensive-zone positioning",

    description:
      "Don't just watch the puck. Watch how the forwards maintain separation as the play develops and where open ice appears.",

    watchFor: [
      "Where are the forwards positioned as the play develops?",
      "How does the weak-side forward find open ice?",
      "What happens to the defenders as the puck changes sides?"
    ],

    game: "Seattle vs. Vancouver",

    date: "Sept. 26, 2026",

    goalLabel: "Goal Visualizer example · goal 469",

    gamecenterLink:
      "https://www.nhl.com/gamecenter/sea-vs-van/2026/09/26/2026010056/summary",

    visualizerLink:
      "https://www.nhl.com/ppt-replay/goal/2026010056/469"
  }

];


/*
=================================================================
SITE CODE BELOW
You generally don't need to edit anything below this point.
=================================================================
*/

const categories = [
  "All",
  ...new Set(lessons.map(x => x.category))
];

const filters = document.getElementById("filters");
const library = document.getElementById("library");


function renderFilters(active = "All") {

  filters.innerHTML = categories.map(c =>

    `<button
      class="filter ${c === active ? 'active' : ''}"
      onclick="render('${c.replaceAll("'","\\'")}')">
      ${c}
    </button>`

  ).join("");

}


function render(active = "All") {

  renderFilters(active);

  const shown =
    active === "All"
      ? lessons
      : lessons.filter(x => x.category === active);


  library.innerHTML = shown.map(x => `

    <article class="card">

      <div class="card-top"></div>

      <div class="content">

        <div class="eyebrow">
          ${x.category} · ${x.concept}
        </div>

        <h2>${x.title}</h2>

        <div class="meta">
          ${x.game} · ${x.date}
        </div>

        <div class="description">
          ${x.description}
        </div>

        <div class="watch">

          <strong>WATCH FOR</strong>

          <ol>
            ${x.watchFor.map(i => `<li>${i}</li>`).join("")}
          </ol>

        </div>

        <div class="goal-id">
          <strong>On NHL.com:</strong> ${x.goalLabel}
        </div>

        <div class="actions">

          <a
            class="primary"
            href="${x.gamecenterLink}"
            target="_blank"
            rel="noopener">
            OPEN NHL GAMECENTER ↗
          </a>

          <a
            class="secondary"
            href="${x.visualizerLink}"
            target="_blank"
            rel="noopener">
            Quick visualizer ↗
          </a>

        </div>

        <div class="note">
          Use Gamecenter for the full NHL interface and controls.
          Quick visualizer opens the standalone tracking view.
        </div>

      </div>

    </article>

  `).join("");

}


render();

</script>

</body>
</html>
